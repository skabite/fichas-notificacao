<title>Evoluções e Termos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: uma coluna (lista → modelo). No modelo: paciente e atalhos do mesmo procedimento no topo, ajustes, o texto vivo, barra de ação fixa embaixo. */
:root{
  --bg:#eef2f3;          /* fundo, cinza frio puxado para o petróleo */
  --surface:#ffffff;
  --ink:#15232a;
  --muted:#56676f;
  --line:#d4dde0;
  --accent:#1d5f78;      /* petróleo */
  --accent-ink:#ffffff;
  --accent-soft:#deebf0;
  --blank:#fff0c9;       /* campo em branco: âmbar */
  --blank-ink:#6e4500;
  --blank-line:#d39a1c;
  --ok:#2d6a3e;
  --paper:#ffffff;       /* a folha impressa é sempre clara */
  --paper-ink:#1b1b1b;
  --paper-line:#9aa3a7;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1519;--surface:#162127;--ink:#e2eaed;--muted:#94a6ad;--line:#2a3a42;
  --accent:#74b6d0;--accent-ink:#0a1a20;--accent-soft:#1c3541;
  --blank:#3b2d0b;--blank-ink:#ffd480;--blank-line:#b8861f;--ok:#7cc48f;
  --paper:#f7f6f2;--paper-ink:#1b1b1b;--paper-line:#8d969a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1519;--surface:#162127;--ink:#e2eaed;--muted:#94a6ad;--line:#2a3a42;
  --accent:#74b6d0;--accent-ink:#0a1a20;--accent-soft:#1c3541;
  --blank:#3b2d0b;--blank-ink:#ffd480;--blank-line:#b8861f;--ok:#7cc48f;
  --paper:#f7f6f2;--paper-ink:#1b1b1b;--paper-line:#8d969a;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}

/* início */
.home{padding-block:24px 40px;display:flex;flex-direction:column;gap:18px}
.home h1{font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.home .lead{margin:4px 0 0;color:var(--muted)}
.busca{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:6px}
.busca input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:17px}
.busca input::placeholder{color:var(--muted)}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.res{display:flex;flex-direction:column;gap:20px}
.grupo h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lista{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;color:inherit;text-decoration:none;border-top:1px solid var(--line);min-height:62px}
.item:first-child{border-top:0}
.item:hover{background:var(--accent-soft)}
.item b{display:block;font-size:17px;line-height:1.25}
.item small{display:block;color:var(--muted);font-size:14px;line-height:1.3;margin-top:2px}
.sigla{font:500 11px var(--mono);letter-spacing:.06em;padding:4px 0;text-align:center;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.sigla.imp{border-color:var(--accent);color:var(--accent)}
.sigla.pos{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.sigla.ref{border-style:dashed}
.tag{display:inline-block;font:500 10.5px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--blank-ink);background:var(--blank);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.seta{color:var(--muted);font-size:22px}
.vazio-busca{padding:16px;color:var(--muted)}

/* paciente em atendimento: só na memória desta página */
.pacbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;background:var(--accent-soft);border-radius:10px;padding:5px 6px 5px 14px;font-size:14px}
.pacbar span{flex:1 1 14em;min-width:0}
.pacbar small{color:var(--muted);font-size:13px}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 8px;border-radius:8px}

/* cabeçalho do modelo */
.topo{display:flex;gap:12px;align-items:flex-start;padding-block:16px 12px}
.voltar{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:44px;padding:0 14px;font-weight:700;white-space:nowrap}
.topo h1{font-size:22px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.topo small{color:var(--muted);font-size:14px}
.tipo{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* do mesmo procedimento: uma fileira que rola de lado no celular */
.kit{display:flex;flex-direction:column;gap:6px;min-width:0}
.kit h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.kit-l{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
@media (min-width:700px){.kit-l{flex-wrap:wrap;overflow:visible}}
.kchip{flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 5px;min-height:38px;color:inherit;text-decoration:none;font-size:14px;line-height:1.2}
.kchip:hover{background:var(--accent-soft)}
.kchip .sigla{min-width:2.7rem;padding:2px 4px}
.rasc{margin:0;background:var(--blank);color:var(--blank-ink);border-radius:10px;padding:10px 14px;font-size:14px}

/* controles */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-size:15px;text-align:left;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.inp{display:flex;align-items:center;gap:8px}
.inp input,.inp textarea{flex:1;min-width:0;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.inp input{height:44px}
.inp textarea{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.4}
.inp input.curto{flex:0 1 120px}
.inp span{color:var(--muted)}
.outro{margin-top:6px}
.calc{font:500 16px var(--mono);color:var(--accent);padding-block:8px}
.rot{font-size:14px;font-weight:700}
.ajuda{color:var(--muted);font-size:13px}

/* tela do modelo */
.ed{display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.dica{margin:0;color:var(--muted);font-size:14px}
.ajustes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.ajustes summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;font-weight:700;font-size:15px}
.ajustes summary::-webkit-details-marker{display:none}
.ajustes summary small{font-weight:400;color:var(--muted);font-size:13px;text-align:right}
.ajustes summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.ajustes[open] summary::after{transform:rotate(180deg)}
.aj-lista{display:flex;flex-direction:column;gap:10px;padding:4px 0 14px}
.aj-lista .campo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.aj-lista .rot{min-width:10.5em}
.aj-lista .chip{min-height:36px;padding:6px 12px;font-size:14px}
.aj-lista .inp input{height:40px}

/* texto da evolução */
.evo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;font:14.5px/1.9 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.evo p{margin:0 0 4px}
.pill{display:inline;font:inherit;border:0;padding:1px 5px;border-radius:4px;background:var(--accent-soft);color:var(--ink);border-bottom:2px solid var(--accent);-webkit-box-decoration-break:clone;box-decoration-break:clone;text-align:left;white-space:pre-wrap}
.pill.falta{background:var(--blank);color:var(--blank-ink);border-bottom:2px dashed var(--blank-line);font-style:italic}
.pill.opc{background:transparent;color:var(--muted);border-bottom:2px dashed var(--line)}
.pill.calc-p{border-bottom-style:dotted;cursor:default}

/* folha impressa */
.papel{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(20,40,50,.12);padding:clamp(18px,5vw,44px);font:14px/1.5 var(--serif);overflow-wrap:anywhere}
.papel h1{font-size:18px;line-height:1.25;margin:0 0 10px;font-weight:600;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.papel h2{font-size:15px;margin:16px 0 6px;font-weight:600}
.papel p{margin:0 0 7px;text-align:justify}
.papel .sub{color:#444}
.papel ul,.papel ol{margin:0 0 8px;padding-left:1.3em}
.papel li{margin-bottom:3px}
.papel table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}
.papel th,.papel td{border:1px solid #c9cdd0;padding:4px 6px;text-align:left;vertical-align:top}
.papel th{background:#f1f3f4}
.papel .tabela{overflow-x:auto}
.papel .checks{display:flex;flex-wrap:wrap;gap:4px 20px}
.papel .assin{margin-top:34px;border-top:1px solid #333;padding-top:3px;font-size:12.5px;max-width:440px}
.papel .assin span{display:none}
.papel .local{margin-top:10px;text-align:right}
.papel .caixa{border:1px solid #999;padding:10px 12px;margin:10px 0}
.papel .caixa p:last-child{margin-bottom:0}
.papel .nota{margin-top:22px;font-size:12px;font-style:italic;color:#555}
.papel .folheto li{margin-bottom:8px}
.ln{display:inline-block;min-width:9em;border-bottom:1px solid var(--paper-line);height:1.1em;vertical-align:baseline}
.ln.longa{min-width:18em}
.inl{font:inherit;color:inherit;background:#fff6dc;border:0;border-bottom:1.5px dashed #c99a2e;padding:0 4px;border-radius:2px;max-width:100%;min-width:6ch}
.inl:not(:placeholder-shown){background:#e8f1f5;border-bottom:1.5px solid #1d5f78}
.inl[type="date"]{min-width:10ch}
textarea.inl{display:block;width:100%;min-height:3.2em;resize:vertical;margin-top:4px}
.calc-inl{font-weight:600;border-bottom:1px dotted #1d5f78;padding:0 2px}
.calc-inl:empty{display:inline-block;min-width:3em;border-bottom:1px solid var(--paper-line)}
.so-print{display:none}
.chk{font:inherit;border:0;background:#fff6dc;border-radius:2px;padding:0 2px;color:inherit;font-size:16px;line-height:1}

/* formulário oficial com campos por cima */
.fundo{position:relative;container-type:inline-size;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(20,40,50,.12);border-radius:2px;overflow:hidden}
.fundo img{display:block;width:100%;height:auto}
.ov{position:absolute;transform:translateY(-100%);border:0;background:rgba(255,236,170,.75);color:#0d2a8a;font:500 1.7cqw/1.2 var(--ui);text-align:left;padding:.2cqw .5cqw;border-radius:.4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:2.4cqw}
.ov.cheio{background:rgba(222,235,240,.55)}
.ov.opc{background:rgba(220,225,228,.45)}
.ov.area{transform:none;white-space:pre-wrap;overflow:auto;align-content:start}
.ov:empty::after{content:attr(data-r);color:#8a6400;font-style:italic}
.ov.opc:empty::after{color:#77838a}

/* barra de ação */
.barra{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-top:10px;padding-bottom:max(10px, env(safe-area-inset-bottom, 0px));margin-top:8px}
.status{flex:1 1 100%;font-size:14px;color:var(--muted)}
.status.pend{color:var(--blank-ink)}
.status.pend b{background:var(--blank);padding:1px 6px;border-radius:4px}
.status.pronto{color:var(--ok);font-weight:700}
.btn{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700;font-size:15px}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:0 22px;flex:1 1 auto}
.aviso{font-size:13px;color:var(--muted);flex-basis:100%}
@media (min-width:700px){.status{flex-basis:200px}.btn.prim{flex:0 0 auto}}

/* folha de preenchimento */
.veu{position:fixed;inset:0;background:rgba(5,15,20,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:600px;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:16px max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:80vh;overflow:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sh-h b{font-size:18px}
.sh-x{border:0;background:none;color:var(--muted);font-weight:700;height:40px}
.sh-b{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet .chip{min-height:46px;font-size:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sobe .18s ease-out}}
@keyframes sobe{from{transform:translateY(12px);opacity:.4}}

@media print{
  @page{size:A4;margin:16mm}
  @page formulario{margin:0}
  body{background:#fff;padding:0}
  body::before,.topo,.barra,.dica,.ajustes,.toast,.sheet,.veu,.pacbar,.kit,.rasc{display:none!important}
  .ed{display:block;padding:0}
  .papel{box-shadow:none;padding:0;border-radius:0;font-size:11.5pt}
  .inl{background:none!important;border:0;border-bottom:1px solid #777;padding:0}
  .inl:not(:placeholder-shown){border-bottom:0}
  .inl::placeholder{color:transparent}
  .inl[type="date"],.inl[type="text"]{display:none}
  .so-print{display:inline}
  .papel h1,.papel h2{break-after:avoid}
  .papel li,.papel p,.papel tr,.papel .caixa,.papel .assin,.papel .tabela{break-inside:avoid}
  .chk{background:none}
  .calc-inl{border:0}
  .fundo{page:formulario;box-shadow:none;width:210mm;margin:0}
  .ov{background:none!important;color:#000}
  .ov:empty::after{content:""}
}
</style>

<div class="wrap"><main id="app"></main></div>
<div class="veu" id="veu" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" hidden>
  <div class="sh-h"><b id="sh-t"></b><button type="button" class="sh-x" id="sh-x">Fechar</button></div>
  <div id="sh-c"></div>
  <small class="ajuda" id="sh-a"></small>
  <div class="sh-b"><button type="button" class="btn" id="sh-ok">Pronto</button><button type="button" class="btn prim" id="sh-prox">Próximo em branco →</button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="modelos.js"></script>
<script>
(function(){
const MODELOS = window.MODELOS || [];
const KITS = window.KITS || [];
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const br = s => { if (!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const extenso = s => { if (!s) return ''; const [y,m,d] = s.split('-').map(Number); return `${d} de ${MESES[m-1]} de ${y}`; };
const cheio = x => String(x ?? '').trim() !== '';
let reduz = false; try { reduz = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
let podeImprimir = false; try { podeImprimir = window.self === window.top; } catch(e){}

let filtro = 'tudo', busca = '';
const estado = {};   // valores por modelo, só nesta sessão
const pac = {};      // dados do paciente em atendimento, comuns a todos os modelos. Só na memória: nunca vão para o armazenamento.
let origem = null;   // modelo de onde se veio pelo atalho "Do mesmo procedimento"
let atualizar = () => {};
let papel = null, ultimoFoco = null;

const modelo = id => MODELOS.find(x => x.id === id);
const campo = (m, id) => m.campos.find(c => c.id === id);
const vazioDe = c => c.vazio || c.rotulo.toLowerCase();

/* ---------- categorias ---------- */
function cat(m){
  if (m.tipo === 'evolucao') return 'evolucao';
  if (m.tipo === 'impresso' && (m.sub === 'termo' || m.sub === 'cuidados')) return m.sub;
  return 'outros';
}
const SIGLAS = { evolucao: ['EVO', ''], termo: ['TCLE', 'imp'], cuidados: ['PÓS', 'pos'] };
const sigla = m => SIGLAS[cat(m)] || (m.tipo === 'consulta' ? ['REF', 'ref'] : ['REQ', 'imp']);
const NOMES = { evolucao: 'Evolução', termo: 'Termo de consentimento', cuidados: 'Cuidados pós' };
const nomeTipo = m => NOMES[cat(m)] || (m.tipo === 'consulta' ? 'Consulta' : 'Formulário');

/* ---------- perfil do profissional (médico, CRM, cidade…): um valor só, para todos os modelos ---------- */
const perfil = () => store.get('mod.perfil', {});
(function(){
  const p = perfil(); let mudou = false;
  MODELOS.forEach(m => {
    const l = store.get('mod.lembrar.' + m.id, null); if (!l) return;
    m.campos.forEach(c => { if (c.perfil && !(c.id in p) && cheio(l[c.id])){ p[c.id] = l[c.id]; mudou = true; } });
  });
  if (mudou) store.set('mod.perfil', p);
})();

/* ---------- dados ---------- */
function iniciais(m){
  const lemb = store.get('mod.lembrar.' + m.id, {});
  const p = perfil();
  const v = {};
  m.campos.forEach(c => {
    if (c.tipo === 'calc') return;
    if (c.paciente && (c.id in pac)) v[c.id] = pac[c.id];
    else if (c.perfil && (c.id in p)) v[c.id] = p[c.id];
    else if (c.lembrar && cheio(lemb[c.id])) v[c.id] = lemb[c.id];
    else if (c.padrao === 'hoje') v[c.id] = c.tipo === 'data' ? iso(new Date()) : br(iso(new Date()));
    else v[c.id] = c.padrao != null ? c.padrao : '';
  });
  return v;
}
// ao abrir: o que é do paciente ou do profissional vem do valor comum
function sincroniza(m, v){
  const p = perfil();
  m.campos.forEach(c => {
    if (c.tipo === 'calc') return;
    if (c.paciente && (c.id in pac)) v[c.id] = pac[c.id];
    else if (c.perfil && (c.id in p)) v[c.id] = p[c.id];
  });
  const ci = campo(m, 'idade');
  if (ci && ci.tipo !== 'calc' && !cheio(v.idade)){ const a = idadeDe(pac.nasc); if (a) v.idade = a; }
}
// a cada mudança: paciente vai para a memória da página; lembrados e perfil vão para o aparelho
function registrar(m, v){
  const o = {}; const p = perfil(); let mp = false;
  m.campos.forEach(c => {
    if (c.tipo === 'calc') return;
    if (c.paciente){ pac[c.id] = v[c.id] ?? ''; return; }
    if (c.lembrar) o[c.id] = v[c.id];
    if (c.perfil && (v[c.id] ?? '') !== (p[c.id] ?? '')){ p[c.id] = v[c.id] ?? ''; mp = true; }
  });
  if (m.campos.some(c => c.lembrar && !c.paciente)) store.set('mod.lembrar.' + m.id, o);
  if (mp) store.set('mod.perfil', p);
}
function cond(expr, v){
  if (!expr) return true;
  const k = expr.match(/^(\w+)(!?=)(.*)$/);
  if (!k) return cheio(v[expr]);
  const val = v[k[1]] || '';
  return k[2] === '=' ? val === k[3] : val !== k[3];
}
function idadeDe(s){
  const k = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (!k) return '';
  const hoje = new Date(); let a = hoje.getFullYear() - +k[3];
  if (hoje.getMonth() + 1 < +k[2] || (hoje.getMonth() + 1 === +k[2] && hoje.getDate() < +k[1])) a--;
  return a >= 0 && a < 130 ? String(a) : '';
}
const somaDias = (d0, n) => { const d = new Date(d0); d.setDate(d.getDate() + n); return br(iso(d)); };
function mostra(m, c, v){
  if (c.tipo === 'calc'){
    if (c.idade) return idadeDe(v[c.idade]);
    const base = v[c.de]; if (!base) return '';
    const d0 = new Date(base + 'T12:00:00'); if (isNaN(d0)) return '';
    if (c.dias != null || c.diasDe){
      const dias = c.dias != null ? String(c.dias) : String(v[c.diasDe] || '');
      const r = dias.match(/(\d+)\s*(?:-|–|a|até)\s*(\d+)/);
      if (r) return somaDias(d0, +r[1]) + ' a ' + somaDias(d0, +r[2]);
      const u = dias.match(/\d+/); return u ? somaDias(d0, +u[0]) : '';
    }
    let anos = c.anos || 0;
    if (c.anosPor){
      const val = norm(v[c.anosPor.campo] || '');
      const k = Object.keys(c.anosPor).find(x => x !== 'campo' && val.includes(norm(x)));
      if (!k) return '';
      anos = c.anosPor[k];
    }
    d0.setFullYear(d0.getFullYear() + anos);
    return br(iso(d0));
  }
  const x = String(v[c.id] ?? '').trim();
  if (!x) return '';
  if (c.tipo === 'data') return c.formato === 'extenso' ? extenso(x) : br(x);
  return x;
}
function linhas(m, v){
  let n = 0;
  return m.linhas.map(l => typeof l === 'string' ? {t:l} : l).filter(l => cond(l.se, v)).map(l => {
    const t = l.t.replace(/\{#(\.?)\}/g, (_, rep) => rep ? String(n) : String(++n));
    const out = []; const re = /\{(\w+)\}/g; let i = 0, k;
    while ((k = re.exec(t))){ if (k.index > i) out.push({s:t.slice(i, k.index)}); out.push({id:k[1]}); i = re.lastIndex; }
    if (i < t.length) out.push({s:t.slice(i)});
    return out;
  });
}
const textoPlano = (m, v) => linhas(m, v).map(l => l.map(p => {
  if (p.s != null) return p.s;
  const c = campo(m, p.id); if (!c) return '';
  const x = mostra(m, c, v); if (x) return x;
  return c.opcional ? (c.copia || '') : '___';
}).join('')).join('\n');
function pendentes(m, v){
  if (m.tipo === 'impresso' && !m.fundo) return pendPapel(m, v);
  const ids = [];
  const add = c => { if (c && !ids.includes(c.id) && c.tipo !== 'calc' && !c.opcional && !mostra(m, c, v)) ids.push(c.id); };
  if (m.tipo === 'evolucao') linhas(m, v).forEach(l => l.forEach(p => p.id && add(campo(m, p.id))));
  else if (m.fundo) m.campos.forEach(add);
  return ids;
}
// na folha: campos visíveis e vazios, na ordem em que aparecem
function pendPapel(m, v){
  if (!papel) return [];
  const ids = [];
  papel.querySelectorAll('[data-id]').forEach(e => {
    const id = e.dataset.id; if (ids.includes(id) || e.closest('[hidden]')) return;
    const c = campo(m, id); if (!c || c.opcional || c.tipo === 'calc' || cheio(v[id])) return;
    ids.push(id);
  });
  return ids;
}
// campos que incluem/tiram trechos ou não aparecem no texto como campo editável: ficam em "Ajustes"
function chaves(m){
  if (m.fundo) return [];
  const usados = new Set(), conds = new Set();
  const addCond = s => { const k = String(s).match(/^(\w+)/); if (k) conds.add(k[1]); };
  (m.linhas || []).forEach(l => {
    const t = typeof l === 'string' ? l : l.t;
    (t.match(/\{(\w+)\}/g) || []).forEach(x => usados.add(x.slice(1, -1)));
    if (l.se) addCond(l.se);
  });
  if (m.corpo){
    (m.corpo.match(/\{\w+(=[^}]*)?\}/g) || []).forEach(x => usados.add(x.match(/^\{(\w+)/)[1]));
    (m.corpo.match(/data-se="[^"]+"/g) || []).forEach(x => addCond(x.slice(9, -1)));
  }
  return m.campos.filter(c => c.tipo !== 'calc' && (conds.has(c.id) || !usados.has(c.id)));
}

/* ---------- do mesmo procedimento ---------- */
function kitDe(id){
  const out = [];
  KITS.forEach(k => { if (k.includes(id)) k.forEach(x => { if (x !== id && !out.includes(x) && modelo(x)) out.push(x); }); });
  return out;
}
const base = c => c.tipo === 'data' ? 'data' : 'texto';
// "Exérese de {lesao}|Exérese de lesão de pele": vale a primeira alternativa com todos os campos preenchidos
function preenche(tpl, a, va){
  for (const alt of tpl.split('|')){
    let ok = true;
    const s = alt.replace(/\{(\w+)\}/g, (_, id) => { const c = campo(a, id); const x = c ? mostra(a, c, va) : ''; if (!x) ok = false; return x; });
    if (ok) return s;
  }
  return '';
}
// ao abrir B: traz dos modelos do mesmo procedimento já abertos o que foi escolhido lá
// (campos de mesmo nome e os mapeados em A.leva[B]). Só mexe no que em B ainda está no padrão
// ou foi trazido antes sem edição; o modelo de onde se veio tem prioridade.
const auto = {};     // por modelo: valores que vieram de outro modelo e ainda não foram editados
function puxar(b, vb, de){
  const kit = kitDe(b.id);
  const fontes = [...(de && kit.includes(de) ? [de] : []), ...kit.filter(x => x !== de)].filter(x => estado[x]);
  if (!fontes.length) return;
  const iniB = iniciais(b);
  const au = auto[b.id] || (auto[b.id] = {});
  const feito = new Set();
  const livre = id => !feito.has(id) && (vb[id] === iniB[id] || (id in au && vb[id] === au[id]));
  const poe = (id, x) => { vb[id] = x; au[id] = x; feito.add(id); };
  const aceita = (c, x) => !(c.tipo === 'opcoes' && !c.livre && !c.opcoes.includes(x));
  fontes.forEach(aid => {
    const a = modelo(aid), va = estado[aid], iniA = iniciais(a);
    const mapa = a.leva && a.leva[b.id];
    if (mapa) Object.keys(mapa).forEach(id => {
      if (!campo(b, id) || !livre(id)) return;
      const x = preenche(mapa[id], a, va); if (x) poe(id, x);
    });
    b.campos.forEach(c => {
      if (c.tipo === 'calc' || c.paciente || c.perfil || !livre(c.id)) return;
      const ca = campo(a, c.id); if (!ca || ca.tipo === 'calc' || base(ca) !== base(c)) return;
      const x = va[c.id];
      if (!cheio(x) || x === iniA[c.id] || !aceita(c, x)) return;
      poe(c.id, x);
    });
  });
}

/* ---------- controles ---------- */
function controle(m, c, v, aoMudar){
  const w = el('div', 'ctl');
  const fid = 'f-' + m.id + '-' + c.id;
  if (c.tipo === 'opcoes'){
    const row = el('div', 'chips');
    const outroInp = document.createElement('input');
    const botoes = c.opcoes.map(o => {
      const b = el('button', 'chip', o + (c.sufixo ? ' ' + c.sufixo : '')); b.type = 'button';
      b.onclick = () => { aoMudar(o, 'escolha'); sync(); };
      row.append(b); return [o, b];
    });
    let bOutro = null, boxOutro = null;
    if (c.livre){
      bOutro = el('button', 'chip', 'Outro…'); bOutro.type = 'button'; row.append(bOutro);
      boxOutro = el('div', 'inp outro'); outroInp.id = fid + '-outro'; outroInp.placeholder = 'Escreva aqui';
      outroInp.setAttribute('aria-label', c.rotulo + ': outro'); outroInp.autocomplete = 'off';
      boxOutro.append(outroInp); boxOutro.hidden = true;
      bOutro.onclick = () => { boxOutro.hidden = false; if (c.opcoes.includes(v[c.id])) aoMudar('', 'texto'); sync(); outroInp.focus(); };
      outroInp.oninput = () => aoMudar(outroInp.value, 'texto');
      w._input = outroInp;
    }
    function sync(){
      const cur = v[c.id] || '';
      botoes.forEach(([o, b]) => b.setAttribute('aria-pressed', cur === o));
      if (bOutro){
        const fora = !c.opcoes.includes(cur) && (cur !== '' || !boxOutro.hidden);
        bOutro.setAttribute('aria-pressed', fora);
        boxOutro.hidden = !fora;
        if (fora && document.activeElement !== outroInp) outroInp.value = cur;
      }
    }
    w.append(row); if (boxOutro) w.append(boxOutro);
    sync(); w._sync = sync;
    if (!(bOutro && !boxOutro.hidden)) w._input = null;
  } else if (c.tipo === 'calc'){
    const d = el('div', 'calc'); w.append(d);
    w._sync = () => { d.textContent = mostra(m, c, v) || '—'; }; w._sync();
  } else {
    const box = el('div', 'inp');
    const longo = c.tipo === 'textolongo';
    const inp = document.createElement(longo ? 'textarea' : 'input'); inp.id = fid;
    if (!longo) inp.type = c.tipo === 'data' ? 'date' : 'text';
    if (c.tipo === 'numero'){ inp.inputMode = 'decimal'; inp.className = 'curto'; }
    if (c.placeholder) inp.placeholder = c.placeholder;
    inp.autocomplete = 'off';
    inp.value = v[c.id] || '';
    inp.addEventListener(c.tipo === 'data' ? 'change' : 'input', () => aoMudar(inp.value, 'texto'));
    box.append(inp); if (c.sufixo) box.append(el('span', null, c.sufixo));
    w.append(box); w._input = inp; w._longo = longo;
    w._sync = () => { if (document.activeElement !== inp) inp.value = v[c.id] || ''; };
  }
  return w;
}

function htmlEvo(m, v){
  return linhas(m, v).map(l => '<p>' + l.map(p => {

  }).join('') + '</p>').join('');

// corpo do impresso: {campo} vira campo na folha, {campo=valor} vira ☐/☒, {=campo} só mostra o valor (muda em "Ajustes")
function htmlPapel(m, v){
  let h = m.corpo.replace(/\{(\w+)=([^}]+)\}/g, (_, id, val) => {
    const on = (v[id] || '') === val;
    return `<button type="button" class="chk" data-id="${id}" data-val="${esc(val)}" aria-pressed="${on}">${on ? '☒' : '☐'}</button>`;
  });
  h = h.replace(/\{=(\w+)\}/g, (_, id) => { const c = campo(m, id); return c ? `<span class="calc-inl" data-calc="${id}">${esc(mostra(m, c, v))}</span>` : ''; });
  h = h.replace(/\{(\w+)\}/g, (_, id) => {
    const c = campo(m, id); if (!c) return '';
    const ph = esc(c.placeholder || c.rotulo.toLowerCase());
    if (c.tipo === 'calc') return `<span class="calc-inl" data-calc="${id}">${esc(mostra(m, c, v))}</span>`;
    if (c.tipo === 'textolongo') return `<textarea class="inl" data-id="${id}" placeholder="${ph}" aria-label="${esc(c.rotulo)}">${esc(v[id] || '')}</textarea>`;
    if (c.tipo === 'data') return `<input class="inl" type="date" data-id="${id}" value="${esc(v[id] || '')}" aria-label="${esc(c.rotulo)}"><span class="so-print" data-print="${id}">${esc(mostra(m, c, v)) || '<span class="ln"></span>'}</span>`;
    return `<input class="inl" type="text" data-id="${id}" value="${esc(v[id] || '')}" placeholder="${ph}" aria-label="${esc(c.rotulo)}" autocomplete="off"><span class="so-print" data-print="${id}">${esc(mostra(m, c, v)) || '<span class="ln"></span>'}</span>`;
  });
  return h.replace(/<table>/g, '<div class="tabela"><table>').replace(/<\/table>/g, '</table></div>');
}
// leva ao próximo campo em branco da folha, depois de "atual" (ou ao primeiro)
function proximoPapel(m, v, atual){
  const pend = pendentes(m, v);
  const vis = [...papel.querySelectorAll('[data-id]')].filter(e => !e.closest('[hidden]'));
  const outro = e => pend.includes(e.dataset.id) && (!atual || e.dataset.id !== atual.dataset.id);
  const alvo = (atual ? vis.slice(vis.indexOf(atual) + 1).find(outro) : null) || vis.find(outro);
  if (!alvo){ if (atual) atual.blur(); toast(pend.length ? 'Não há outro campo em branco.' : 'Tudo preenchido.'); return; }
  alvo.scrollIntoView({ block: 'center', behavior: reduz ? 'auto' : 'smooth' });
  alvo.focus({ preventScroll: true });
}

function painelAjustes(m, v, ks, ctrls){
  const aj = el('details', 'ajustes');
  const resumo = el('summary');
  resumo.append(el('span', null, 'Ajustes do texto'), el('small', null, 'incluir ou tirar linhas'));
  aj.append(resumo);
  // evoluções: começa aberto; folhas para imprimir: começa fechado (o que importa é a folha). Fica a última escolha.
  const chave = m.tipo === 'evolucao' ? 'mod.ajustes' : 'mod.ajustes.folha';
  aj.open = store.get(chave, m.tipo === 'evolucao');
  aj.addEventListener('toggle', () => store.set(chave, aj.open));
  const lista = el('div', 'aj-lista');
  ks.forEach(c => {
    const f = el('div', 'campo');
    const lab = el('label', 'rot', c.rotulo);
    if (c.tipo !== 'opcoes') lab.htmlFor = 'f-' + m.id + '-' + c.id;
    const ctl = controle(m, c, v, val => { v[c.id] = val; mudou(m, v); });
    f.append(lab, ctl); lista.append(f); ctrls.push([c, f, ctl]);
  });
  aj.append(lista);
  return aj;
}

function renderModelo(m, v){
  app.innerHTML = ''; papel = null; ultimoFoco = null;
  app.append(topo(m));
  const ed = el('div', 'ed');
  const pb = barraPaciente(); if (pb){ pb.id = 'pacbar'; ed.append(pb); }
  const k = kit(m); if (k) ed.append(k);
  if (m.rascunho) ed.append(avisoRascunho());
  const ctrls = [];
  if (m.tipo === 'evolucao'){
    ed.append(el('p', 'dica', 'Toque nos trechos destacados para mudar. Em âmbar está o que falta; tracejado cinza é opcional.'));
    const ks = chaves(m);
    if (ks.length) ed.append(painelAjustes(m, v, ks, ctrls));
    const folha = el('article', 'evo'); ed.append(folha);
    folha.onclick = e => { const b = e.target.closest('button.pill'); if (b) abrirSheet(m, v, campo(m, b.dataset.id)); };
    app.append(ed); app.append(barra(m, v));
    atualizar = () => {
      ctrls.forEach(([c, f, ctl]) => { ctl._sync && ctl._sync(); });
      folha.innerHTML = htmlEvo(m, v);
      status(m, v);
    };
  } else if (m.fundo){
    ed.append(el('p', 'dica', 'Toque nos campos amarelos do formulário para preencher. Na impressão, só o texto sai por cima do formulário.'));
    const fundo = el('div', 'fundo');
    const img = el('img'); img.src = m.fundo; img.alt = m.titulo; fundo.append(img);
    const bts = m.campos.map(c => {
      const b = el('button', 'ov' + (c.tipo === 'textolongo' ? ' area' : '')); b.type = 'button'; b.dataset.id = c.id; b.dataset.r = c.rotulo;
      const p = c.pos; b.style.left = p.x + '%'; b.style.top = p.y + '%'; b.style.width = p.w + '%'; if (p.h) b.style.height = p.h + '%';
      b.setAttribute('aria-label', c.rotulo);
      b.onclick = () => abrirSheet(m, v, c);
      fundo.append(b); return [c, b];
    });
    ed.append(fundo); app.append(ed); app.append(barra(m, v));
    atualizar = () => {
      bts.forEach(([c, b]) => { const x = mostra(m, c, v); b.textContent = x; b.classList.toggle('cheio', !!x); b.classList.toggle('opc', !x && !!c.opcional); });
      status(m, v);
    };
  } else {
    if (m.campos.some(c => c.tipo !== 'calc')) ed.append(el('p', 'dica', 'Escreva direto na folha. O que ficar em branco sai com linha para preencher à mão.'));
    const ks = chaves(m);
    if (ks.length) ed.append(painelAjustes(m, v, ks, ctrls));
    const folha = el('article', 'papel'); ed.append(folha); papel = folha;
    folha.innerHTML = htmlPapel(m, v);
    const ajusta = i => { if (i.tagName === 'INPUT' && i.type === 'text') i.style.width = Math.max(i.value.length, i.placeholder.length, 6) + 3 + 'ch'; };
    const refresca = () => {
      folha.querySelectorAll('[data-calc]').forEach(s => { const c = campo(m, s.dataset.calc); s.textContent = c ? mostra(m, c, v) : ''; });
      folha.querySelectorAll('[data-print]').forEach(s => { const x = mostra(m, campo(m, s.dataset.print), v); s.innerHTML = x ? esc(x) : '<span class="ln"></span>'; });
      folha.querySelectorAll('[data-se]').forEach(e => { e.hidden = !cond(e.dataset.se, v); });
    };
    folha.querySelectorAll('.inl').forEach(i => {
      ajusta(i);
      i.addEventListener(i.type === 'date' ? 'change' : 'input', () => {
        v[i.dataset.id] = i.value; ajusta(i);
        folha.querySelectorAll(`.inl[data-id="${i.dataset.id}"]`).forEach(o => { if (o !== i){ o.value = i.value; ajusta(o); } });
        refresca(); registrar(m, v); status(m, v);
      });
      if (i.tagName === 'INPUT') i.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); proximoPapel(m, v, i); } });
    });
    folha.addEventListener('focusin', e => { if (e.target.matches('[data-id]')) ultimoFoco = e.target; });
    folha.onclick = e => {
      const b = e.target.closest('button.chk'); if (!b) return;
      v[b.dataset.id] = b.dataset.val; registrar(m, v); atualizar();
    };
    app.append(ed); app.append(barra(m, v));
    atualizar = () => {
      ctrls.forEach(([c, f, ctl]) => { ctl._sync && ctl._sync(); });
      folha.querySelectorAll('.inl').forEach(i => { const x = v[i.dataset.id] || ''; if (document.activeElement !== i && i.value !== x){ i.value = x; ajusta(i); } });
      folha.querySelectorAll('button.chk').forEach(o => { const on = (v[o.dataset.id] || '') === o.dataset.val; o.textContent = on ? '☒' : '☐'; o.setAttribute('aria-pressed', on); });
      refresca(); status(m, v);
    };
  }
  atualizar();
}

function mudou(m, v){ registrar(m, v); atualizar(); }

/* ---- folha de preenchimento ---- */
const sheet = document.getElementById('sheet'), veu = document.getElementById('veu');
let sheetCtx = null;
function abrirSheet(m, v, c){
  if (!c) return;
  sheetCtx = {m, v, c};
  document.getElementById('sh-t').textContent = c.rotulo + (c.sufixo && c.tipo !== 'opcoes' ? ` (${c.sufixo})` : '');
  document.getElementById('sh-a').textContent = c.ajuda || (c.paciente ? 'Não fica salvo. Vale para os outros modelos enquanto esta página estiver aberta.' : c.perfil ? 'Fica salvo neste aparelho e vale para todos os modelos.' : c.lembrar ? 'Fica salvo neste aparelho para a próxima vez.' : c.opcional ? 'Opcional: pode ficar em branco.' : '');
  const box = document.getElementById('sh-c'); box.innerHTML = '';
  const ctl = controle(m, c, v, (val, como) => {
    v[c.id] = val; mudou(m, v); atualizaProx();
    if (como === 'escolha') setTimeout(proximo, 120);
  });
  box.append(ctl);
  if (ctl._input && !ctl._longo) ctl._input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); proximo(); } });
  veu.hidden = false; sheet.hidden = false;
  atualizaProx();
  const foco = ctl._input || box.querySelector('.chip[aria-pressed="true"]') || box.querySelector('.chip');
  if (foco) foco.focus();
}
function atualizaProx(){
  if (!sheetCtx) return;
  const {m, v, c} = sheetCtx;
  document.getElementById('sh-prox').hidden = !pendentes(m, v).some(id => id !== c.id);
}
function proximo(){
  if (!sheetCtx) return;
  const {m, v, c} = sheetCtx;
  const pend = pendentes(m, v).filter(id => id !== c.id);
  if (pend.length) abrirSheet(m, v, campo(m, pend[0]));
  else { fecharSheet(); if (!pendentes(m, v).length) toast(m.tipo === 'evolucao' ? 'Tudo preenchido. É só copiar.' : 'Tudo preenchido.'); }
}
function fecharSheet(){ sheet.hidden = true; veu.hidden = true; sheetCtx = null; }
document.getElementById('sh-x').onclick = fecharSheet;
document.getElementById('sh-ok').onclick = fecharSheet;
document.getElementById('sh-prox').onclick = proximo;
veu.onclick = fecharSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) fecharSheet(); });

/* ---------- utilidades ---------- */
function copiar(txt){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(() => true, () => copiaAntiga(txt));
  } catch(e){}
  return Promise.resolve(copiaAntiga(txt));
}
function copiaAntiga(txt){
  const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0'; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}
let tt;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- navegação ---------- */
function abrir(id, semPuxar){
  const m = modelo(id); if (!m){ renderInicio(); return; }
  if (!estado[id]) estado[id] = iniciais(m);
  const v = estado[id];
  sincroniza(m, v);
  if (!semPuxar) puxar(m, v, origem);
  origem = null;
  const rec = store.get('mod.recentes', []).filter(x => x !== id); rec.unshift(id); store.set('mod.recentes', rec.slice(0, 3));
  fecharSheet();
  renderModelo(m, v);
  window.scrollTo(0, 0);
}
function rota(){
  const h = location.hash.replace('#', '');
  if (h.startsWith('m-')) abrir(h.slice(2)); else { origem = null; fecharSheet(); renderInicio(); }
}
window.addEventListener('hashchange', rota);
rota();
})();
</script>
